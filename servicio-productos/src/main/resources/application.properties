spring.application.name=servicio-productos

# Puerto del microservicio. Local usa 8081; los contenedores ECS/ECR pueden sobrescribirlo con SERVER_PORT.
server.port=${SERVER_PORT:8081}

# Origenes permitidos por CORS (separados por coma). En producción dejar solo el dominio del frontend.
app.cors.origenes-permitidos=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Health check para el load balancer / ECS
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true