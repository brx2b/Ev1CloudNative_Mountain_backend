spring.application.name=servicio-productos

# Puerto del microservicio. Local usa 8081; los contenedores ECS/ECR pueden sobrescribirlo con SERVER_PORT.
server.port=${SERVER_PORT:8081}

# Origenes permitidos por CORS (separados por coma). En producción dejar solo el dominio del frontend.
app.cors.origenes-permitidos=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Health check para el load balancer / ECS
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# ============================================================
# Kafka: consume pedidos.creados para descontar stock.
# El broker vive en backend-3 (listener EXTERNAL 29092). Local usa
# localhost:29092 (docker compose de backend-3 levantado).
# earliest: si el servicio estuvo caido, procesa los eventos acumulados.
# ============================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
app.kafka.topic.pedidos=pedidos.creados
# Stock inicial de cada producto del catálogo (demo en memoria).
app.stock.inicial=50