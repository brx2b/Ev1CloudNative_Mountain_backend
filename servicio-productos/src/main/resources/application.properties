spring.application.name=servicio-productos

# Puerto del microservicio. Local usa 8081; los contenedores ECS/ECR pueden sobrescribirlo con SERVER_PORT.
server.port=${SERVER_PORT:8081}

# Origenes permitidos por CORS (separados por coma). En producción dejar solo el dominio del frontend.
app.cors.origenes-permitidos=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Health check para el load balancer / ECS
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# ============================================================
# RabbitMQ: consume pedido.creado para descontar stock.
# RABBITMQ_HOST es "rabbitmq" dentro del compose de backend-1 y la
# IP privada de backend-1 para los MS de backend-2.
# ============================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:pedidos360}
spring.rabbitmq.password=${RABBITMQ_PASS:cambiar-en-produccion}
app.mq.exchange=pedidos.eventos
app.mq.routing-pedido-creado=pedido.creado
# Stock inicial de cada producto del catálogo (demo en memoria).
app.stock.inicial=50