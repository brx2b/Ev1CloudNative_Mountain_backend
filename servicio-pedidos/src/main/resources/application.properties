spring.application.name=servicio-pedidos

# Puerto del microservicio. Local usa 8082; los contenedores ECS/ECR pueden sobrescribirlo con SERVER_PORT.
server.port=${SERVER_PORT:8082}

# Origenes permitidos por CORS (separados por coma). En producción dejar solo el dominio del frontend.
app.cors.origenes-permitidos=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ============================================================
# Seguridad JWT - Azure AD / Microsoft Entra ID
# Deja app.seguridad.habilitado=false para desarrollo local (demo sin token).
# Conecta Azure seteando las variables de entorno:
#   JWT_ENABLED=true
#   JWT_JWKS_URI=https://login.microsoftonline.com/{TU-TENANT-ID}/discovery/v2.0/keys
#   JWT_ISSUER_URI=https://login.microsoftonline.com/{TU-TENANT-ID}/v2.0
#   JWT_AUDIENCES=api://{TU-CLIENT-ID}
#   JWT_REQUIRED_SCOPES=orders.write
#   JWT_REQUIRED_ROLES=            (opcional, roles de aplicación de Entra ID)
# ============================================================
app.seguridad.habilitado=${JWT_ENABLED:false}
app.seguridad.jwks-uri=${JWT_JWKS_URI:}
app.seguridad.emisor-uri=${JWT_ISSUER_URI:}
app.seguridad.audiencias=${JWT_AUDIENCES:}
app.seguridad.scopes-requeridos=${JWT_REQUIRED_SCOPES:orders.write}
app.seguridad.roles-requeridos=${JWT_REQUIRED_ROLES:}

# Health check para el load balancer / ECS
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true