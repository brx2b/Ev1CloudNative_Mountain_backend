spring.application.name=servicio-usuarios

# Puerto del microservicio. Local usa 8083; los contenedores ECS/ECR pueden sobrescribirlo con SERVER_PORT.
server.port=${SERVER_PORT:8083}

# Origenes permitidos por CORS (separados por coma). En producción dejar solo el dominio del frontend.
app.cors.origenes-permitidos=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ============================================================
# Emisión/validación de JWT local (HS256) para el flujo de la tienda.
# La ordenes (servicio-pedidos) validan este mismo secreto cuando
# JWT_LOCAL_ENABLED=true, además del JWKS de Azure.
# ============================================================
# Secreto compartido (mínimo 32 bytes). En producción usar una
# variable de entorno fuerte y no commitearlo.
app.auth.secreto=${JWT_SECRET:cambiar-en-produccion-secreto-compartido-32bytes}
app.auth.emisor=${JWT_EMISOR:pedidos360-usuarios}
app.auth.audiencia=${JWT_AUDIENCIA:pedidos360-api}
app.auth.scope=${JWT_SCOPE:orders.write}
app.auth.horas-expiracion=${JWT_HORAS_EXPIRACION:8}
# Clave del primer login del seed para que funcione en la demo sin registrar.
app.auth.usuario-seed-email=${JWT_SEED_EMAIL:demo@summitlab.cl}
app.auth.usuario-seed-password=${JWT_SEED_PASSWORD:demo1234}

# Health check para el load balancer / ECS
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true