spring.application.name=servicio-gateway

# Puerto del gateway. Local usa 9000; los contenedores ECS/ECR pueden sobrescribirlo con SERVER_PORT.
server.port=${SERVER_PORT:9000}

# Origenes permitidos por CORS (separados por coma). En producción dejar solo el dominio del frontend.
app.cors.origenes-permitidos=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ============================================================
# Servicios destino del enrutamiento (un solo entrypoint para el frontend).
# En Docker Compose apuntan a los nombres de contenedor (servicio-usuarios:8080, etc).
# ============================================================
app.servicios.auth-url=${AUTH_SERVICE_URL:http://localhost:8083}
app.servicios.productos-url=${PRODUCTOS_SERVICE_URL:http://localhost:8081}
app.servicios.pedidos-url=${PEDIDOS_SERVICE_URL:http://localhost:8082}
app.servicios.timeout-ms=${GATEWAY_TIMEOUT_MS:10000}

# Health check para el load balancer / ECS
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true