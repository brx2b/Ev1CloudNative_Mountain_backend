# Entrypoint temporal en la EC2 hasta crear el API Gateway de AWS.
# Enruta por prefijo a cada microservicio (todos escuchan :8080 internos).
upstream productos { server servicio-productos:8080; }
upstream pedidos { server servicio-pedidos:8080; }
upstream usuarios { server servicio-usuarios:8080; }

server {
    listen 80;

    # Salud del propio nginx (healthcheck de Docker).
    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    # Catálogo -> servicio-productos :8081
    location /products {
        proxy_pass http://productos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth (registro/ingreso) -> servicio-usuarios :8083
    location /auth/ {
        proxy_pass http://usuarios;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pedidos -> servicio-pedidos :8082
    location /orders {
        proxy_pass http://pedidos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Registro de endpoints de cada MS (verificación de las rutas del futuro API Gateway).
    location /api/productos/ { proxy_pass http://productos/api/; }
    location /api/pedidos/ { proxy_pass http://pedidos/api/; }
    location /api/usuarios/ { proxy_pass http://usuarios/api/; }

    # Timeouts alineados con GATEWAY_TIMEOUT_MS (10s) de los MS.
    proxy_connect_timeout 10s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}
