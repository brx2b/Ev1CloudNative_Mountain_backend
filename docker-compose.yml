version: "3.9"

# Levanta los microservicios del backend localmente (modo demo, sin Azure/AWS).
# Requiere haber empaquetado antes:
#   mvn clean package
#   docker compose up --build
#
# Puertos:
#   9000 -> servicio-gateway     (entrypoint único que usa el frontend)
#   8081 -> servicio-productos
#   8082 -> servicio-pedidos
#   8083 -> servicio-usuarios
services:
  servicio-gateway:
    build:
      context: ./servicio-gateway
    container_name: pedidos360-servicio-gateway
    ports:
      - "9000:8080"
    environment:
      SERVER_PORT: "8080"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      AUTH_SERVICE_URL: "http://servicio-usuarios:8080"
      PRODUCTOS_SERVICE_URL: "http://servicio-productos:8080"
      PEDIDOS_SERVICE_URL: "http://servicio-pedidos:8080"
    depends_on:
      - servicio-usuarios
      - servicio-productos
      - servicio-pedidos
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  servicio-productos:
    build:
      context: ./servicio-productos
    container_name: pedidos360-servicio-productos
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: "8080"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  servicio-pedidos:
    build:
      context: ./servicio-pedidos
    container_name: pedidos360-servicio-pedidos
    ports:
      - "8082:8080"
    environment:
      SERVER_PORT: "8080"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      # Al conectar Azure, activa con JWT_ENABLED=true y setea jwks/emisor/audiencias.
      JWT_ENABLED: "false"
      JWT_JWKS_URI: ""
      JWT_ISSUER_URI: ""
      JWT_AUDIENCES: ""
      JWT_REQUIRED_SCOPES: "orders.write"
      JWT_REQUIRED_ROLES: ""
      # Validación local del JWT emitido por servicio-usuarios (mismo secreto).
      # true => /orders exige un JWT de la tienda (registro/login).
      JWT_LOCAL_ENABLED: "true"
      JWT_LOCAL_SECRET: "cambiar-en-produccion-secreto-compartido-32bytes"
      JWT_LOCAL_ISSUER: "pedidos360-usuarios"
      JWT_LOCAL_AUDIENCE: "pedidos360-api"
      JWT_LOCAL_REQUIRED_SCOPE: "orders.write"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  servicio-usuarios:
    build:
      context: ./servicio-usuarios
    container_name: pedidos360-servicio-usuarios
    ports:
      - "8083:8080"
    environment:
      SERVER_PORT: "8080"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      JWT_SECRET: "cambiar-en-produccion-secreto-compartido-32bytes"
      JWT_EMISOR: "pedidos360-usuarios"
      JWT_AUDIENCIA: "pedidos360-api"
      JWT_SCOPE: "orders.write"
      JWT_HORAS_EXPIRACION: "8"
      JWT_SEED_EMAIL: "demo@summitlab.cl"
      JWT_SEED_PASSWORD: "demo1234"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5