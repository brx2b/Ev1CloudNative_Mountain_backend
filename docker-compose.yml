version: "3.9"

# Microservicios del backend (sin gateway Spring: el entrypoint único es
# AWS API Gateway, que enruta /products, /auth/* y /orders a cada servicio).
# Requiere haber empaquetado antes:
#   mvn clean package
#   docker compose up --build
#
# Puertos (cada MS escucha en 8080 dentro de su contenedor):
#   8081 -> servicio-productos
#   8082 -> servicio-pedidos
#   8083 -> servicio-usuarios
#
# Mensajeria: Kafka en backend-3 (EC2 10.0.1.13, listener EXTERNAL 29092).
# pedidos publica el evento pedido.creado en el topico pedidos.creados;
# productos lo consume con groupId productos-stock. Ver .env: KAFKA_BOOTSTRAP_SERVERS.
#
# El entrypoint público es el nginx del EC2 frontend (misma VPC), que rutea
# /api/* directo a estos puertos. No hay gateway en este compose.
# En el SG solo abrir 8081-8083 desde el SG del frontend (nada al mundo)
# y en el SG de backend-3 abrir 29092 hacia este SG y el de backend-2.
#
# Memoria: cada JVM se limita con JAVA_OPTS (default -Xms128m -Xmx384m).
# Con 3 servicios el consumo ronda 1.2-1.5 GB: cabe en una t3.small (2 GB)
# para demo, ideal t3.medium (4 GB) para producción liviana.
#
services:
  servicio-productos:
    build:
      context: ./servicio-productos
    container_name: pedidos360-servicio-productos
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: "8080"
      JAVA_OPTS: "${JAVA_OPTS:--Xms128m -Xmx384m}"
      CORS_ALLOWED_ORIGINS: "${FRONTEND_ORIGIN:-http://localhost:5173}"
      # Kafka en backend-3 (listener EXTERNAL). En AWS: KAFKA_BOOTSTRAP_SERVERS=10.0.1.13:29092
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:-localhost:29092}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  servicio-pedidos:
    build:
      context: ./servicio-pedidos
    container_name: pedidos360-servicio-pedidos
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      SERVER_PORT: "8080"
      JAVA_OPTS: "${JAVA_OPTS:--Xms128m -Xmx384m}"
      CORS_ALLOWED_ORIGINS: "${FRONTEND_ORIGIN:-http://localhost:5173}"
      # JWT de Microsoft Entra ID / Azure AD.
      JWT_ENABLED: "true"
      JWT_JWKS_URI: "https://login.microsoftonline.com/${AZURE_TENANT_ID}/discovery/v2.0/keys"
      JWT_ISSUER_URI: "https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0"
      JWT_AUDIENCES: "${AZURE_API_AUDIENCE}"
      JWT_REQUIRED_SCOPES: "orders.write"
      JWT_REQUIRED_ROLES: ""
      # Se desactiva el JWT HS256 local porque el login ahora lo gestiona Azure.
      JWT_LOCAL_ENABLED: "false"
      JWT_LOCAL_SECRET: ""
      JWT_LOCAL_ISSUER: "pedidos360-usuarios"
      JWT_LOCAL_AUDIENCE: "pedidos360-api"
      JWT_LOCAL_REQUIRED_SCOPE: "orders.write"
      # Kafka en backend-3 (listener EXTERNAL). En AWS: KAFKA_BOOTSTRAP_SERVERS=10.0.1.13:29092
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:-localhost:29092}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  servicio-usuarios:
    build:
      context: ./servicio-usuarios
    container_name: pedidos360-servicio-usuarios
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      SERVER_PORT: "8080"
      JAVA_OPTS: "${JAVA_OPTS:--Xms128m -Xmx384m}"
      CORS_ALLOWED_ORIGINS: "${FRONTEND_ORIGIN:-http://localhost:5173}"
      JWT_SECRET: "cambiar-en-produccion-secreto-compartido-32bytes"
      JWT_EMISOR: "pedidos360-usuarios"
      JWT_AUDIENCIA: "pedidos360-api"
      JWT_SCOPE: "orders.write"
      JWT_HORAS_EXPIRACION: "8"
      JWT_SEED_EMAIL: "demo@summitlab.cl"
      JWT_SEED_PASSWORD: "demo1234"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
